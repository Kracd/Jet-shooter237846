<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Shooter Game</title>
    <style>
        /* CSS for Fullscreen Display */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            background-color: #000;
            /* Retro Font */
            font-family: 'Courier New', monospace; 
            color: white;
            user-select: none;
            overflow: hidden; 
        }

        #game-container {
            position: relative;
            background-color: #000;
        }

        #gameCanvas {
            display: block;
        }

        /* Stats Bar */
        #stats-bar {
            width: 800px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 5px 0;
            margin-bottom: 5px;
            gap: 20px;
            font-family: 'Courier New', monospace;
        }

        #score-display, #level-display {
            display: none;
        }

        #health-bar-track {
            display: flex;
            gap: 2px;
            height: 15px;
            border: 1px solid #555;
            padding: 1px;
        }

        .health-segment {
            width: 15px;
            background-color: #00ff00;
            transition: background-color 0.1s ease;
        }

        .health-segment.dimmed {
            background-color: #550000;
        }
        
        #powerup-timer {
            background-color: gold;
            color: black;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: none;
        }
        
        /* === START SCREEN STYLES === */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            color: #00ff00; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: 'Courier New', monospace; 
            z-index: 15; 
            transition: opacity 1.5s ease-in-out; 
        }

        #start-screen h1 {
            font-size: 4em;
            text-shadow: 0 0 10px #00ff00, 0 0 20px rgba(0, 255, 0, 0.5); 
            margin-bottom: 5px;
        }

        #title-text {
            font-size: 1.5em;
            color: #ff00ff; 
            margin-bottom: 50px;
        }

        #start-screen button {
            padding: 15px 30px;
            font-size: 1.5em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            background-color: #000;
            color: #00ff00;
            border: 3px solid #00ff00;
            border-radius: 0;
            margin-bottom: 40px;
            transition: background-color 0.2s;
        }

        #start-screen button:hover {
            background-color: #00ff00;
            color: black;
        }

        #controls-info {
            font-size: 1.1em;
            line-height: 1.5;
            color: #00ffff; 
        }
        /* === END START SCREEN STYLES === */

        /* --- GAME OVER SCREEN STYLES --- */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            color: #FF4500; 
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 2em;
            z-index: 10;
            font-family: 'Courier New', monospace;
        }

        /* Enforce Red for the Main Title and add Retro Glow */
        #game-over-screen h1 {
            font-size: 5em;
            color: #FF0000; /* BRIGHT RED */
            text-shadow: 0 0 10px #FF0000, 0 0 20px #FF4500;
            margin-bottom: 20px;
        }
        
        /* Restart Button Styling */
        #game-over-screen button {
            padding: 10px 20px;
            font-size: 0.7em;
            cursor: pointer;
            margin-top: 40px;
            background-color: #000;
            color: #FF0000;
            border: 2px solid #FF0000;
            border-radius: 0;
            font-family: 'Courier New', monospace;
            transition: background-color 0.2s;
        }
        #game-over-screen button:hover {
            background-color: #FF0000;
            color: black;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="stats-bar">
            <span id="score-display">Score: 0</span>
            <span id="level-display">Level: 1</span>
            
            <span id="powerup-timer"></span>
            <div id="health-bar-track">
            </div>
        </div>
        
        <div id="start-screen">
            <h1>JET SHOOTER</h1>
            <p id="title-text">"Very fun and addictive" - Litteraly No</p>
            <button onclick="startGame()">START GAME</button>
            <div id="controls-info">
                <p>CONTROLS:</p>
                <p>Arrow Keys: Move Jet</p>
                <p>Spacebar: Shoot</p>
                <p>Press **R** to Sacrifice Health for 30s Invulnerability</p>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="game-over-screen">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button onclick="restartGame()">Restart</button>
        </div>
    </div>

    <script>
        // --- Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const WIDTH = 800;
        const HEIGHT = 600;

        // Stat elements
        const healthBarTrack = document.getElementById('health-bar-track');
        const powerupTimerDisplay = document.getElementById('powerup-timer');

        // Game State Variables
        let score = 0;
        let level = 0;
        let player_health = 15;
        const MAX_HEALTH = 15;
        let max_health_capacity = MAX_HEALTH; 
        let running = false; 
        let game_started = false; 
        let jet_alive = true;
        let frame_count = 0;
        let next_level_threshold = 100;
        
        let enemy_base_hue = 0; 
        let is_leveling_up = false;

        // Jet Properties
        const JET_WIDTH = 64;
        const JET_HEIGHT = 32;
        const JET_ACCEL = 0.5;
        const JET_FRICTION = 0.9;
        let jet = {
            x: 50, y: HEIGHT / 2 - JET_HEIGHT / 2,
            width: JET_WIDTH, height: JET_HEIGHT,
            color: 'blue',
            speed: 5,
            vx: 0, 
            vy: 0, 
            invulnerable: false 
        };

        // Load Images 
        const jetImage = new Image();
        jetImage.src = 'jet_sprite.png'; 
        const starSprite = new Image();
        starSprite.src = 'New Piskel.png';

        // Player Bullet Properties
        let bullets = [];
        const BULLET_WIDTH = 10;
        const BULLET_HEIGHT = 4;
        let can_shoot = true;
        const BASE_SHOOT_DELAY = 160; 
        let fire_rate_multiplier = 1;
        let shoot_delay = BASE_SHOOT_DELAY;

        // Enemy Bullet Properties
        let enemyBullets = [];
        const ENEMY_BULLET_DAMAGE = 1; 
        const ENEMY_BULLET_WIDTH = 8;
        const ENEMY_BULLET_HEIGHT = 8;
        const ENEMY_BULLET_SPEED = 9;

        // Powerup Properties
        let powerups = [];
        const POWERUP_SIZE = 25;
        const POWERUP_FALL_SPEED = 2;
        const POWERUP_DURATION = 10000; 
        let powerup_timer_end = 0;

        // Enemy Properties
        let enemies = [];
        // Progressive Enemy Speed
        const ENEMY_BASE_SPEED = 3;
        const ENEMY_SPEED_SCALING = 0.5; 
        // ----------------------------------
        const ENEMY_SPAWN_RATE = 30;
        const SHOOTER_SPAWN_CHANCE = 1 / 5;
        const ENEMY_SHOOT_DELAY = 1300; 
        const SPAWN_ZONE_HEIGHT = 500;
        const spawn_min_y = (HEIGHT - SPAWN_ZONE_HEIGHT) / 2;
        const spawn_max_y = spawn_min_y + SPAWN_ZONE_HEIGHT;
        const GOLDEN_ENEMY_SPAWN_CHANCE = 0.01;
        const GOLDEN_ENEMY_POINTS = 10;
        
        // Particle Constants
        let particles = [];
        const TRAIL_LIFESPAN = 30;
        let explosionParticles = [];
        const EXPLOSION_LIFESPAN = 40; 
        // Increased particle count
        const EXPLOSION_PARTICLE_COUNT = 40;
        // ----------------------------------
        
        // Starfield Constants
        const STAR_COUNT = 250; 
        const STARS_PER_LAYER = Math.floor(STAR_COUNT / 3);
        const LAYER_SPEEDS = [0.8, 2.5, 5.0]; 
        const LAYER_SIZES = [1, 2, 3];        
        let stars = [];
        let scorePopups = [];

        // Class Definitions
        class Star {
            constructor(x, y, size, speed, layer) {
                this.x = x; this.y = y; this.width = size;
                this.height = size; this.speed = speed;
                this.layer = layer;
            }
        }
        
        class Powerup {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.width = POWERUP_SIZE;
                this.height = POWERUP_SIZE; this.type = type;
                this.color = '#00ff00'; this.speed = POWERUP_FALL_SPEED;
            }
        }

        // --- Utility Functions ---
        function setRandomEnemyHue() {
            let newHue;
            do {
                newHue = Math.floor(Math.random() * 360);
            } while (Math.abs(newHue - enemy_base_hue) < 30);
            enemy_base_hue = newHue;
        }
        
        function updateHealthBar() {
            const segments = healthBarTrack.children;
            for (let i = 0; i < max_health_capacity; i++) { 
                if (segments[i]) { 
                    if (i < player_health) {
                        segments[i].classList.remove('dimmed');
                    } else {
                        segments[i].classList.add('dimmed');
                    }
                }
            }
        }

        function setupHealthBar() {
            healthBarTrack.innerHTML = '';
            for (let i = 0; i < max_health_capacity; i++) { 
                const segment = document.createElement('div');
                segment.classList.add('health-segment');
                segment.id = `segment-${i}`;
                healthBarTrack.appendChild(segment);
            }
            updateHealthBar();
        }

        // --- Initialization Functions ---
        function initializeStars() {
            stars = [];
            for (let i = 1; i <= 3; i++) { 
                for (let j = 0; j < STARS_PER_LAYER; j++) {
                    const initialX = Math.random() * WIDTH * 2;
                    const initialY = Math.random() * HEIGHT;
                    
                    const speed = LAYER_SPEEDS[i - 1] + Math.random() * 0.5;
                    const size = LAYER_SIZES[i - 1] + Math.random() * 0.5;

                    stars.push(new Star(initialX, initialY, size, speed, i));
                }
            }
        }

        // --- Input Handling ---
        let keys = {};
        document.addEventListener('keydown', (e) => { keys[e.code] = true; });
        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function handleInput() {
            if (!running || !jet_alive || is_leveling_up) return; 

            let inputX = 0;
            let inputY = 0;
            if (keys['ArrowUp']) inputY -= 1;
            if (keys['ArrowDown']) inputY += 1;
            if (keys['ArrowLeft']) inputX -= 1;
            if (keys['ArrowRight']) inputX += 1;
            
            jet.vx += inputX * JET_ACCEL;
            jet.vy += inputY * JET_ACCEL;
            
            const maxSpeed = jet.speed;
            jet.vx = Math.min(Math.max(jet.vx, -maxSpeed), maxSpeed);
            jet.vy = Math.min(Math.max(jet.vy, -maxSpeed), maxSpeed);

            if (keys['Space'] && can_shoot) {
                let bullet = {
                    x: jet.x + jet.width,
                    y: jet.y + jet.height / 2 - BULLET_HEIGHT / 2,
                    width: BULLET_WIDTH, height: BULLET_HEIGHT, color: 'white'
                };
                bullets.push(bullet);
                can_shoot = false;
                setTimeout(() => { can_shoot = true; }, shoot_delay);
            }
            
            if (keys['KeyR']) { 
                sacrificeHealth();
                keys['KeyR'] = false; 
            }
        }

        // --- Game Logic ---
        
        const MIN_HEALTH_SACRIFICE = 5; 
        const SACRIFICE_COST = 2;

        function sacrificeHealth() {
            if (!running || !jet_alive || max_health_capacity <= SACRIFICE_COST || player_health <= MIN_HEALTH_SACRIFICE || is_leveling_up) {
                return; 
            }

            max_health_capacity -= SACRIFICE_COST;
            player_health = Math.min(player_health, max_health_capacity);
            setupHealthBar(); 
            triggerScreenShake(8); 
            
            // Custom 30-second invulnerability duration
            let invulnerability_duration = 30000; 
            jet.invulnerable = true;
            setTimeout(() => { 
                jet.invulnerable = false; 
            }, invulnerability_duration); 
        }

        function updateJetPosition() {
            if (!jet_alive) return;
            
            jet.vx *= JET_FRICTION;
            jet.vy *= JET_FRICTION;
            
            jet.x += jet.vx;
            jet.y += jet.vy;

            jet.x = Math.min(Math.max(jet.x, 0), WIDTH - jet.width);
            jet.y = Math.min(Math.max(jet.y, 0), HEIGHT - jet.height);
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += 10;
                if (bullets[i].x > WIDTH) {
                    bullets.splice(i, 1);
                }
            }
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].x -= 9;
                if (enemyBullets[i].x + ENEMY_BULLET_WIDTH < 0) {
                    enemyBullets.splice(i, 1);
                }
            }
        }

        function updateParallax() {
            stars.forEach(star => {
                star.x -= star.speed;
                if (star.x + star.width < 0) {
                    star.x = WIDTH;
                    star.y = Math.random() * HEIGHT;
                }
            });
        }
        
        function updatePowerups() {
            for (let i = powerups.length - 1; i >= 0; i--) {
                let pu = powerups[i];
                // Use ENEMY_BASE_SPEED for consistency with enemy movement
                pu.x -= ENEMY_BASE_SPEED * 0.7; 
                pu.y += pu.speed * 0.5;

                if (pu.x + pu.width < 0 || pu.y > HEIGHT) {
                    powerups.splice(i, 1);
                }
            }
        }

        function updatePowerupTimer() {
            const now = Date.now();
            if (now < powerup_timer_end) {
                const remaining = powerup_timer_end - now;
                const seconds = Math.ceil(remaining / 1000);
                powerupTimerDisplay.textContent = `FIRE BOOST: ${seconds}s`;
                powerupTimerDisplay.style.display = 'block';
            } else if (fire_rate_multiplier !== 1) {
                fire_rate_multiplier = 1;
                shoot_delay = BASE_SHOOT_DELAY;
                powerupTimerDisplay.style.display = 'none';
            }
        }
        
        function activateFireRateBoost() {
            fire_rate_multiplier = 2;
            powerup_timer_end = Date.now() + POWERUP_DURATION;
            shoot_delay = BASE_SHOOT_DELAY / fire_rate_multiplier;
            
            // Screen shake feedback
            triggerScreenShake(10); 
        }

        function createTrailParticle() {
            if (!jet_alive || frame_count % 3 !== 0) return; 
            const engineX = jet.x - 3;
            const engineY = jet.y + jet.height / 2;
            let particle = {
                x: engineX,
                y: engineY + (Math.random() * jet.height * 0.4) - (jet.height * 0.2),
                size: Math.random() * 1.5 + 0.5,
                velocity: Math.random() * 1 + 0.5,
                lifespan: TRAIL_LIFESPAN,
                life: TRAIL_LIFESPAN
            };
            particles.push(particle);
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x -= p.velocity;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        function createExplosion(x, y, color) {
            // Use increased particle count
            const numParticles = EXPLOSION_PARTICLE_COUNT;
            let r = 255, g = 69, b = 0; 
            if (color && color.startsWith('#') && color.length === 7) {
                r = parseInt(color.substring(1, 3), 16);
                g = parseInt(color.substring(3, 5), 16);
                b = parseInt(color.substring(5, 7), 16);
            }
            else if (color && color.startsWith('hsl')) {
                r = 255; g = 165; b = 0; 
            }

            for (let i = 0; i < numParticles; i++) {
                const speedMultiplier = 6; 
                let particle = {
                    x: x, y: y, size: Math.random() * 3 + 1,
                    velocity_x: (Math.random() - 0.5) * 2 * speedMultiplier,
                    velocity_y: (Math.random() - 0.5) * 2 * speedMultiplier,
                    lifespan: EXPLOSION_LIFESPAN, life: EXPLOSION_LIFESPAN,
                    r: r, g: g, b: b
                };
                explosionParticles.push(particle);
            }
        }

        function updateExplosionParticles() {
            for (let i = explosionParticles.length - 1; i >= 0; i--) {
                let p = explosionParticles[i];
                p.x += p.velocity_x;
                p.y += p.velocity_y;
                p.life--;
                if (p.life <= 0) {
                    explosionParticles.splice(i, 1);
                }
            }
        }
        
        let screenShakeMagnitude = 0;
        const MAX_SHAKE = 5;
        const SHAKE_DECAY = 0.8;
        let playerHitFlash = 0;
        const FLASH_DURATION = 5;
        
        function triggerScreenShake(magnitude) { screenShakeMagnitude = magnitude; }
        function updateScreenShake() {
            if (screenShakeMagnitude > 0) {
                screenShakeMagnitude *= SHAKE_DECAY;
                if (screenShakeMagnitude < 0.1) screenShakeMagnitude = 0;
            }
        }
        function triggerPlayerHitFlash() { playerHitFlash = FLASH_DURATION; }
        function updatePlayerHitFlash() { if (playerHitFlash > 0) playerHitFlash--; }
        
        function updateScorePopups() {
            for (let i = scorePopups.length - 1; i >= 0; i--) {
                let popup = scorePopups[i];
                popup.y -= 1; 
                popup.life--; 
                
                if (popup.life <= 0) {
                    scorePopups.splice(i, 1);
                }
            }
        }

        // Enemy Logic
        function enemyShoot(enemy) {
            if (!jet_alive) return;
            
            let bullet = {
                x: enemy.x,
                y: enemy.y + enemy.height / 2 - ENEMY_BULLET_HEIGHT / 2,
                width: ENEMY_BULLET_WIDTH,
                height: ENEMY_BULLET_HEIGHT,
                damage: ENEMY_BULLET_DAMAGE,
                color: 'red'
            };
            enemyBullets.push(bullet);
            enemy.lastShot = Date.now();
        }

        function spawnEnemy() {
            if (frame_count % ENEMY_SPAWN_RATE === 0) {
                let enemy_type = 'normal';
                
                if (Math.random() < GOLDEN_ENEMY_SPAWN_CHANCE) {
                    enemy_type = 'golden';
                } else if (Math.random() < SHOOTER_SPAWN_CHANCE) { 
                    enemy_type = 'shooter';
                }

                let enemy_width, enemy_height, enemy_color, shootable;

                if (enemy_type === 'golden') {
                    enemy_width = 50; enemy_height = 40; enemy_color = '#FFD700';
                    shootable = false;
                } else if (enemy_type === 'shooter') {
                    enemy_width = 45; enemy_height = 35; 
                    enemy_color = 'purple';
                    shootable = true;
                } else {
                    enemy_width = 40 + Math.floor(Math.random() * 11) - 5;
                    enemy_height = 30 + Math.floor(Math.random() * 11) - 5;
                    const saturation = 70; 
                    const lightness = 40;  
                    enemy_color = `hsl(${enemy_base_hue}, ${saturation}%, ${lightness}%)`;
                    shootable = false;
                }
                
                let y_pos = Math.floor(Math.random() * (spawn_max_y - spawn_min_y - enemy_height)) + spawn_min_y;

                let enemy = {
                    x: WIDTH, y: y_pos, width: enemy_width, height: enemy_height,
                    color: enemy_color, type: enemy_type,
                    shootable: shootable,
                    lastShot: Date.now() 
                };
                enemies.push(enemy);
            }
        }

        function updateEnemies() {
            // Calculate current speed based on level
            const currentEnemySpeed = ENEMY_BASE_SPEED + (level - 1) * ENEMY_SPEED_SCALING;

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                
                enemy.x -= currentEnemySpeed; // Use progressive speed
                
                if (enemy.shootable && Date.now() - enemy.lastShot > ENEMY_SHOOT_DELAY) {
                    enemyShoot(enemy);
                }
                
                if (enemy.x + enemy.width < 0) {
                    enemies.splice(i, 1);
                }
            }
        }

        // Collision Logic
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function takeDamage(damage) {
            if (jet.invulnerable) return; 
            
            player_health -= damage;
            updateHealthBar();
            triggerScreenShake(MAX_SHAKE);
            triggerPlayerHitFlash();
            
            if (player_health <= 0) {
                jet_alive = false; 
                createExplosion(jet.x + jet.width / 2, jet.y + jet.height / 2, '#FF4500'); 
                setTimeout(() => {
                    running = false;
                    showGameOver();
                }, 800); 
            }
        }

        const LEVEL_UP_PAUSE = 1200; 

        function levelUpCinematic() {
            is_leveling_up = true;
            running = false; 

            level += 1;
            // FIX: Use a smoother, additive formula for the next score threshold
            next_level_threshold += 100
            
            setRandomEnemyHue();
            
            enemies = [];
            enemyBullets = [];
            
            let flashCounter = 3;
            const flashInterval = setInterval(() => {
                triggerScreenShake(MAX_SHAKE * 1.5);
                if (flashCounter-- <= 0) {
                    clearInterval(flashInterval);
                    setTimeout(() => {
                        is_leveling_up = false;
                        running = true;
                    }, LEVEL_UP_PAUSE); 
                }
            }, 300);
        }

        function checkCollisions() {
            if (jet_alive) {
                for (let i = powerups.length - 1; i >= 0; i--) {
                    let pu = powerups[i];
                    if (checkCollision(jet, pu)) {
                        if (pu.type === 'fire_rate_boost') {
                            activateFireRateBoost();
                        }
                        powerups.splice(i, 1);
                    }
                }
            }

            let pointsGained = 0;
            let enemyHitX = 0, enemyHitY = 0; 

            for (let i = bullets.length - 1; i >= 0; i--) {
                let bullet = bullets[i];
                let bulletHit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let enemy = enemies[j];
                    if (checkCollision(bullet, enemy)) {
                        bullets.splice(i, 1);
                        bulletHit = true;
                        
                        let explosionColor = enemy.type === 'golden' ? '#FFD700' : enemy.color;
                        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, explosionColor);
                        
                        enemyHitX = enemy.x + enemy.width / 2;
                        enemyHitY = enemy.y + enemy.height / 2;
                        
                        let points = enemy.type === 'golden' ? GOLDEN_ENEMY_POINTS : 1;
                        pointsGained += points;

                        enemies.splice(j, 1);
                        break; 
                    }
                }
                if (bulletHit) continue; 
            }
            
            if (pointsGained > 0) {
                score += pointsGained;
                scorePopups.push({
                    x: enemyHitX, 
                    y: enemyHitY, 
                    text: `+${pointsGained}`,
                    life: 60 
                });

                if (score >= next_level_threshold && !is_leveling_up) {
                    levelUpCinematic();
                }
            }

            if (jet_alive) {
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    let eBullet = enemyBullets[i];
                    if (checkCollision(jet, eBullet)) {
                        enemyBullets.splice(i, 1); 
                        takeDamage(eBullet.damage); 
                        break;
                    }
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                if (jet_alive && checkCollision(jet, enemy)) { 
                    enemies.splice(i, 1);
                    takeDamage(1); 
                    break; 
                }
            }
        }


        // --- Drawing Functions ---

        function drawParallaxBackground() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            const useImage = starSprite.complete && starSprite.naturalWidth !== 0;

            stars.forEach(star => {
                let opacity, color;

                if (star.layer === 1) {
                    opacity = 0.2;
                    color = '#8888FF'; 
                } else if (star.layer === 2) {
                    opacity = 0.5;
                    color = '#FFFFFF'; 
                } else {
                    opacity = 0.9;
                    color = '#FFFFE0'; 
                }
                
                ctx.globalAlpha = opacity;
                
                if (useImage) {
                    // Draw using sprite image, scaled up for visibility
                    ctx.drawImage(
                        starSprite, 
                        star.x, star.y, 
                        star.width * 5, star.height * 5 
                    );
                } else {
                    // Fallback to drawing a simple circle
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(star.x + star.width / 2, star.y + star.height / 2, star.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalAlpha = 1.0; 
            });
        }
        
        function drawParticles() {
            particles.forEach(p => {
                const opacity = p.life / TRAIL_LIFESPAN;
                const red = Math.round(255 * opacity + 100 * (1 - opacity));
                const green = Math.round(165 * opacity);
                const blue = 0;
                
                ctx.fillStyle = `rgba(${red}, ${green}, ${blue}, ${opacity})`;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function drawExplosionParticles() {
            for (let i = explosionParticles.length - 1; i >= 0; i--) {
                let p = explosionParticles[i];
                const opacity = p.life / EXPLOSION_LIFESPAN;
                ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawEnemy(enemy) {
            const x = enemy.x, y = enemy.y, w = enemy.width, h = enemy.height;
            const mainColor = enemy.color;
            let detailColor;

            if (enemy.type === 'golden') {
                 detailColor = '#ffdf00'; 
            } else if (enemy.type === 'shooter') {
                 detailColor = '#800080'; 
            } else {
                 const hueMatch = mainColor.match(/hsl\((\d+)/);
                 const hue = hueMatch ? hueMatch[1] : 0;
                 detailColor = `hsl(${hue}, 80%, 25%)`;
            }

            ctx.beginPath();
            ctx.moveTo(x + w, y);
            ctx.lineTo(x, y + h * 0.15);
            ctx.lineTo(x, y + h * 0.85);
            ctx.lineTo(x + w, y + h);
            ctx.closePath();
            
            const bodyGradient = ctx.createLinearGradient(x, y, x + w, y);
            bodyGradient.addColorStop(0, mainColor);
            bodyGradient.addColorStop(1, detailColor);
            ctx.fillStyle = bodyGradient;
            ctx.fill();

            ctx.fillStyle = detailColor;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.6, y + h * 0.2);
            ctx.lineTo(x + w * 0.8, y + h * 0.2);
            ctx.lineTo(x + w * 0.6, y - h * 0.1);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(x + w * 0.6, y + h * 0.8);
            ctx.lineTo(x + w * 0.8, y + h * 0.8);
            ctx.lineTo(x + w * 0.6, y + h * 1.1);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            if (enemy.type === 'shooter') {
                 ctx.fillStyle = 'gray';
                ctx.fillRect(x - 5, y + h / 2 - 2, 5, 4); 
            }
        }
        
        function drawBullet(rect) {
            const x = rect.x, y = rect.y, w = rect.width, h = rect.height;
            
            ctx.beginPath();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x, y, w, h);
            
            const trailWidth = 5;
            const trailX = x - trailWidth;
            
            const trailGradient = ctx.createLinearGradient(trailX, y, x, y);
            trailGradient.addColorStop(0, 'rgba(255, 100, 0, 0.4)');
            trailGradient.addColorStop(1, 'rgba(255, 255, 255, 0.7)');
            
            ctx.fillStyle = trailGradient;
            ctx.fillRect(trailX, y, trailWidth, h);

            ctx.beginPath();
            ctx.moveTo(x + w, y);
            ctx.lineTo(x + w + 3, y + h / 2);
            ctx.lineTo(x + w, y + h);
            ctx.closePath();
            ctx.fillStyle = '#ffffff';
            ctx.fill();
        }
        
        function drawEnemyBullet(rect) {
            const x = rect.x, y = rect.y, w = rect.width, h = rect.height;
            
            ctx.fillStyle = 'red'; 
            ctx.strokeStyle = 'yellow';
            ctx.lineWidth = 1;
            
            ctx.beginPath();
            ctx.arc(x, y + h / 2, w / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            const trailWidth = 8;
            ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
            ctx.fillRect(x + w, y, trailWidth, h);
        }

        function drawPowerup(pu) {
            ctx.fillStyle = pu.color;
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            
            const x = pu.x + pu.width / 2;
            const y = pu.y + pu.height / 2;
            const r = pu.width / 2;
            
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x, y + r);
            ctx.lineTo(x - r, y);
            ctx.lineTo(x, y - r);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = 'red';
            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('F', x, y + 2); 
        }

        function drawScorePopups() {
            scorePopups.forEach(popup => {
                const opacity = popup.life / 60;
                ctx.font = 'bold 20px "Courier New", monospace';
                ctx.fillStyle = `rgba(255, 255, 0, ${opacity})`; 
                ctx.textAlign = 'center';
                ctx.fillText(popup.text, popup.x, popup.y);
            });
        }
        
        function drawLevelUpScreen() {
            if (frame_count % 10 < 5) {
                 ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                 ctx.fillRect(0, 0, WIDTH, HEIGHT);
            }
            
            ctx.font = 'bold 80px "Courier New", monospace';
            ctx.fillStyle = '#00ffff'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 10;
            
            if (frame_count % 100 < 50) {
                 ctx.fillText("LEVEL UP!", WIDTH / 2, HEIGHT / 2 - 40);
            }
            
            ctx.font = 'bold 30px "Courier New", monospace';
            ctx.fillText(`NEW WAVE: ${level}`, WIDTH / 2, HEIGHT / 2 + 50);
            
            ctx.shadowBlur = 0;
        }

        function drawUI() {
            ctx.font = 'bold 24px "Courier New", monospace';
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'left';
            
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            ctx.fillText(`SCORE: ${score}`, 10, 30);
            
            ctx.textAlign = 'right';
            ctx.fillStyle = '#00FF00';
            ctx.fillText(`LEVEL: ${level}`, WIDTH - 10, 30);
            
            // REMOVED: Numeric Health Display

            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        function drawGame() {
            drawParallaxBackground(); 

            let shakeX = 0;
            let shakeY = 0;
            if (screenShakeMagnitude > 0) {
                shakeX = (Math.random() - 0.5) * 2 * screenShakeMagnitude;
                shakeY = (Math.random() - 0.5) * 2 * screenShakeMagnitude;
            }
            ctx.save();
            ctx.translate(shakeX, shakeY);
            
            if (running || is_leveling_up) {
                ctx.strokeStyle = 'rgba(100, 100, 100, 0.5)';
                ctx.lineWidth = 1;
                ctx.strokeRect(0, spawn_min_y, WIDTH, SPAWN_ZONE_HEIGHT);
                drawParticles();

                if (jet_alive) {
                    const flash = (jet.invulnerable && frame_count % 10 < 5) || playerHitFlash > 0;
                    if (flash) {
                        ctx.globalAlpha = 0.5;
                    }
                    
                    if (jetImage.complete && jetImage.naturalWidth !== 0) {
                        ctx.drawImage(jetImage, jet.x, jet.y, jet.width, jet.height);
                    } else {
                        ctx.fillStyle = jet.color;
                        ctx.fillRect(jet.x, jet.y, jet.width, jet.height);
                    }
                    ctx.globalAlpha = 1.0; 
                }

                bullets.forEach(drawBullet);
                enemyBullets.forEach(drawEnemyBullet); 
                powerups.forEach(drawPowerup);
                enemies.forEach(drawEnemy);
            }
            
            drawExplosionParticles(); 
            
            if (is_leveling_up) {
                drawLevelUpScreen();
            }

            ctx.restore();
            
            if (game_started) {
                drawUI();
                drawScorePopups();
            }
        }


        // --- Main Loop and Restart Functions ---
        
        function startGame() {
            const startScreen = document.getElementById('start-screen');
            const fadeDuration = 1500; 

            startScreen.style.opacity = '0';

            setTimeout(() => {
                startScreen.style.display = 'none'; 
                running = true;
                game_started = true;
            }, fadeDuration);
        }

        function gameLoop() {
            updateParallax(); 
            
            if (running) {
                updateJetPosition(); 
                updatePowerupTimer();
                handleInput();
                updateBullets();
                updateScorePopups();

                if (!is_leveling_up) { 
                    spawnEnemy();
                    if (frame_count % 1000 === 0 && Math.random() < 0.5) { 
                        let x_pos = WIDTH;
                        let y_pos = Math.random() * (HEIGHT - POWERUP_SIZE);
                        powerups.push(new Powerup(x_pos, y_pos, 'fire_rate_boost'));
                    }
                    updateEnemies();
                    updatePowerups();
                }

                createTrailParticle(); 
                updateParticles();
                
                updateExplosionParticles(); 
                updateScreenShake();
                updatePlayerHitFlash();
                
                checkCollisions();
                frame_count++;
            } else if (game_started) {
                updateExplosionParticles(); 
                updateScreenShake();
                updatePlayerHitFlash();
            }
            
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        function showGameOver() {
            document.getElementById('final-score').textContent = score;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function restartGame() {
            score = 0;
            level = 1;
            player_health = MAX_HEALTH;
            max_health_capacity = MAX_HEALTH; 
            jet_alive = true; 
            jet.x = 50;
            jet.y = HEIGHT / 2 - JET_HEIGHT / 2;
            jet.vx = 0;
            jet.vy = 0;
            bullets = [];
            enemyBullets = []; 
            enemies = [];
            powerups = [];
            scorePopups = [];
            is_leveling_up = false;
            
            fire_rate_multiplier = 1;
            shoot_delay = BASE_SHOOT_DELAY;
            powerup_timer_end = 0;
            powerupTimerDisplay.style.display = 'none';
            
            setupHealthBar(); 
            document.getElementById('game-over-screen').style.display = 'none';
            running = true;
        }
        
        function initializeGame() {
            setupHealthBar();
            initializeStars();
            gameLoop(); 
        }

        // Initial Call to Start Game
        initializeGame();

    </script>
</body>
